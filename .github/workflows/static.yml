name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            V1/package-lock.json
            V2/package-lock.json
            Beta1/package-lock.json
            BetaV1/package-lock.json

      - name: Install V1
        working-directory: V1
        run: npm ci

      - name: Build V1 (/86/v1)
        working-directory: V1
        run: npm run build
        env:
          PAGES_BASE_PATH: /86/v1

      - name: Install V2
        working-directory: V2
        run: npm ci

      - name: Build V2 (/86/v2)
        working-directory: V2
        run: npm run build
        env:
          PAGES_BASE_PATH: /86/v2

      - name: Install Beta1
        working-directory: Beta1
        run: npm ci

      - name: Build Beta1 (/86/beta1)
        working-directory: Beta1
        run: npm run build
        env:
          PAGES_BASE_PATH: /86/beta1

      - name: Install BetaV1
        working-directory: BetaV1
        run: npm ci

      - name: Build BetaV1 (/86/betav1)
        working-directory: BetaV1
        run: npm run build
        env:
          PAGES_BASE_PATH: /86/betav1

      - name: Assemble multi-version site
        run: |
          rm -rf site
          mkdir -p site/v1 site/v2 site/beta1 site/betav1
          cp site-hub/index.html site/index.html
          cp -R V1/out/. site/v1/
          cp -R V2/out/. site/v2/
          cp -R Beta1/out/. site/beta1/
          cp -R BetaV1/out/. site/betav1/
          ls -la site site/v1 site/v2 site/beta1 site/betav1 | head -60

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
